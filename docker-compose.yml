services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: ironlog-auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - ./services/auth-service/.env
    environment:
      - PORT=4001
      - NODE_ENV=production
    networks:
      - ironlog-network

  workout-service:
    build:
      context: ./services/workout-service
      dockerfile: Dockerfile
    container_name: ironlog-workout-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    env_file:
      - ./services/workout-service/.env
    environment:
      - PORT=4002
      - NODE_ENV=production
    depends_on:
      - auth-service
    networks:
      - ironlog-network

  frontend:
    image: nginx:alpine
    container_name: ironlog-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - workout-service
    networks:
      - ironlog-network

networks:
  ironlog-network:
    driver: bridge
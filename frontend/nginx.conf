server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # هدایت ترافیک به سرویس احراز هویت
    location /auth/ {
        proxy_pass http://auth-service:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # هدایت ترافیک به سرویس تمرین و وزن
    location ~ ^/(workouts|bodyweight|settings|export|import) {
        proxy_pass http://workout-service:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}